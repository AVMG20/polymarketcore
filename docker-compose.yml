services:
  postgres:
    image: postgres:17-alpine
    container_name: pnxcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pnxcore
      POSTGRES_PASSWORD: pnxcore
      POSTGRES_DB: pnxcore
    ports:
      - "5433:5432"
    volumes:
      - pnxcore_postgres_data:/var/lib/postgresql/data

volumes:
  pnxcore_postgres_data:
